[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-outbound-engine"
version = "1.1.2"
description = "Signal-driven outbound engine: capture buying signals, score against an ICP, enrich, draft, and approve - with a full audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mohamed Isaac"}]
dependencies = []

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[project.scripts]
soe = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP017"]  # datetime.UTC is 3.11+; timezone.utc keeps local runs compatible

[tool.mypy]
python_version = "3.11"
strict = true
